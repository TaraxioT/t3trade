name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `vp install` builds node-pty from source: it ships no linux-x64 prebuild for
  # the Node this repo pins, so node-gyp fetches the headers tarball and then
  # SHASUMS256.txt from nodejs.org. On the Blacksmith runners that second fetch
  # intermittently dies with `AggregateError [ETIMEDOUT]` thrown from
  # `internalConnectMultiple` about half a second in — the signature of Node's
  # Happy Eyeballs trying an AAAA route that is advertised but not reachable and
  # burning two 250ms attempts before giving up. The tree is unchanged; the same
  # commit passes on a re-run, which is the worst kind of red.
  #
  # Resolving A records first skips the dead route entirely. Scoped to CI rather
  # than the repo, because it is the runners' network that is dual-stack-broken,
  # not anything about this project.
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  check:
    name: Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Check fork independence from upstream infrastructure
        run: node scripts/check-fork-independence.ts

      - name: Typecheck
        run: vpr typecheck

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # PRs whose changes are confined to fork-owned paths (trading packages,
      # docs — see scripts/test-scope.ts) run only the fork's own tests and
      # skip the Rust/Electron setup those tests never touch. Anything
      # touching upstream code, and every push to main, runs the full suite.
      - name: Determine test scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An upstream sync PR carries hundreds of files and the API refuses
          # to diff it ("the diff exceeded the maximum number of files").
          # An empty list is exactly what test-scope.ts reads as "run
          # everything", which is the right answer for a PR that large, so the
          # failure must not abort the step.
          if ! gh pr diff ${{ github.event.pull_request.number }} --name-only \
            --repo ${{ github.repository }} > "${{ runner.temp }}/changed-files.txt"; then
            echo "test-scope: could not list changed files; running the full suite." >&2
            : > "${{ runner.temp }}/changed-files.txt"
          fi
          node scripts/test-scope.ts "${{ runner.temp }}/changed-files.txt" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        if: steps.scope.outputs.scope != 'fork'
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Electron runtime is installed
        if: steps.scope.outputs.scope != 'fork'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test (fork scope)
        if: steps.scope.outputs.scope == 'fork'
        run: vp run test:fork

      - name: Test (full)
        if: steps.scope.outputs.scope != 'fork'
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run test

      - name: Publish transfer budget report
        if: always()
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Test resource monitor
        if: steps.scope.outputs.scope != 'fork'
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  # Disabled: mobile native static analysis needs a macOS runner and this
  # fork does not develop the mobile app right now. Re-enable when mobile
  # work resumes.
  #   mobile_native_static_analysis:
  #     name: Mobile Native Static Analysis
  #     runs-on: blacksmith-6vcpu-macos-26
  #     timeout-minutes: 25
  #     steps:
  #       - name: Checkout
  #         uses: actions/checkout@v6
  #         with:
  #           sparse-checkout: |
  #             /*
  #             !/.repos/
  #           sparse-checkout-cone-mode: false
  #
  #       - name: Setup Vite+
  #         uses: voidzero-dev/setup-vp@v1
  #         with:
  #           node-version-file: package.json
  #           cache: true
  #           run-install: |
  #             args:
  #               - --filter=@t3tools/scripts...
  #
  #       - name: Install mobile native static analysis tools
  #         run: brew bundle install --file apps/mobile/Brewfile
  #
  #       - name: Lint mobile native sources
  #         run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
