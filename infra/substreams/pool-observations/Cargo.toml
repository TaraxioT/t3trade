[package]
name = "t3trade_pool_observations"
version = "0.1.0"
edition = "2021"

[dependencies]
substreams = "0.7"
substreams-ethereum = "0.11"
prost = "0.13"
prost-types = "0.13"
hex = "0.4"
hex-literal = "0.4"
ethabi = "17"
anyhow = "1"

[build-dependencies]
substreams-ethereum = "0.11"
prost-build = "0.13"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
